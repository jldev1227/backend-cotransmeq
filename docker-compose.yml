services:
  backend:
    image: backend-cotransmeq:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-cotransmeq-nest
    restart: always
    # SIGTERM → el proceso deja de aceptar peticiones, espera a los crons en
    # curso (como mucho 25 s, `LIMITE_APAGADO_MS` en src/lib/apagado.ts) y
    # cierra la base. Los 10 s por defecto de Docker lo cortaban con SIGKILL a
    # mitad de una captura de snapshots en cada despliegue.
    stop_grace_period: 30s
    ports:
      - "3001:4000"
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
      - .azure-openai.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

services:
  backend:
    image: backend-cotransmeq:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-cotransmeq-nest
    restart: always
    ports:
      - "3001:4000"
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

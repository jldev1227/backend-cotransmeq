name: Deploy backend to Proxmox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub solo serializa dentro de este repo; el script usa un flock compartido
  # entre ambos LXC para coordinar los cuatro despliegues del host Proxmox.
  group: backend-cotransmeq-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cotransmeq-ct123, backend-cotransmeq]
    timeout-minutes: 90
    environment: production
    env:
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1

      - name: Build, deploy and verify
        run: sudo --preserve-env=AZURE_OPENAI_API_VERSION,AZURE_OPENAI_DEPLOYMENT,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_KEY,AZURE_OPENAI_MODEL /usr/local/sbin/deploy-backend-cotransmeq "$GITHUB_SHA"
